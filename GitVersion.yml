mode: Mainline
tag-prefix: '[vV]'
commit-message-incrementing: Enabled
branches:
  main:
    regex: ^main$
    tag: ''
    increment: Patch
    is-mainline: true
  feature:
    regex: ^(feature|feat|fix|chore|docs|codex)[/-]
    tag: '{BranchName}'
    increment: Inherit
    source-branches: ['main']
ignore:
  sha: []
